experiment:
  name: town07_generalization_adaptive
  output_root: results/paper_eval
  reference_method: rl_cbf_adaptive
runtime:
  host: localhost
  port: 40000
  traffic_manager_port: 40005
  timeout: 600
  track: SENSORS
  repetitions: 1
  best_every: 0
  reuse_agent: 1
  carla_seed: 2000
  traffic_seed: 2000
  route_id_start: 0
  num_routes: 14
  route_passes: 3
  route_id_max: 13
  routes_dir: simulation/leaderboard/data/generalization_routes/town07
  routes_pattern: town07_short_r{}.xml
  routes_file: simulation/leaderboard/data/generalization_routes/town07/town07_short_r0.xml
  scenarios_file: simulation/leaderboard/data/scenarios/town07_all_scenarios.json
  scenario_parameter_file: simulation/leaderboard/leaderboard/scenarios/scenario_parameter_2.yaml
  team_agent: simulation/leaderboard/team_code/pnp_agent_e2e.py
  debug: 0
  resume: 0
  skip_existed: 0
methods:
- name: rl_cbf_adaptive
  base_agent_config: simulation/leaderboard/team_code/agent_config/pnp_config_rl_cbf_2.yaml
  overrides:
    cbf:
      enabled: true
    rl:
      enabled: true
      eval_only: true
      deterministic_eval: true
      resume_path: results/paper_eval/town05_main_10ms/ckpt_latest.pt
