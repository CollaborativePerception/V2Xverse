experiment:
  name: town10_generalization_pid
  output_root: results/paper_eval
  reference_method: pid_only
runtime:
  host: localhost
  port: 40020
  traffic_manager_port: 40025
  timeout: 600
  track: SENSORS
  repetitions: 1
  best_every: 0
  reuse_agent: 1
  carla_seed: 2000
  traffic_seed: 2000
  route_id_start: 0
  num_routes: 9
  route_passes: 3
  route_id_max: 8
  routes_dir: simulation/leaderboard/data/training_routes/splitted_routes
  routes_pattern: routes_town10_{}.xml
  routes_file: simulation/leaderboard/data/training_routes/splitted_routes/routes_town10_0.xml
  scenarios_file: simulation/leaderboard/data/scenarios/town10_all_scenarios.json
  scenario_parameter_file: simulation/leaderboard/leaderboard/scenarios/scenario_parameter_2.yaml
  team_agent: simulation/leaderboard/team_code/pnp_agent_e2e.py
  debug: 0
  resume: 0
  skip_existed: 0
methods:
- name: pid_only
  base_agent_config: simulation/leaderboard/team_code/agent_config/pnp_config_rl_cbf_2.yaml
  overrides:
    cbf:
      enabled: false
    rl:
      enabled: false
