experiment:
  name: town05_main_10ms
  output_root: results/paper_eval
  reference_method: rl_cbf_adaptive
runtime:
  host: localhost
  port: 40000
  traffic_manager_port: 40005
  timeout: 600
  track: SENSORS
  repetitions: 1
  best_every: 0
  reuse_agent: 1
  carla_seed: 2000
  traffic_seed: 2000
  route_id_start: 0
  num_routes: 105
  route_passes: 1
  route_id_max: 331
  routes_dir: simulation/leaderboard/data/evaluation_routes
  routes_pattern: town05_short_r{}.xml
  routes_file: simulation/leaderboard/data/evaluation_routes/town05_short_r0.xml
  scenarios_file: simulation/leaderboard/data/scenarios/town05_all_scenarios_2.json
  scenario_parameter_file: simulation/leaderboard/leaderboard/scenarios/scenario_parameter_2.yaml
  team_agent: simulation/leaderboard/team_code/pnp_agent_e2e.py
  debug: 0
  resume: 0
  skip_existed: 0
methods:
- name: rl_cbf_adaptive
  base_agent_config: simulation/leaderboard/team_code/agent_config/pnp_config_rl_cbf_2.yaml
  overrides:
    cbf:
      enabled: true
    rl:
      enabled: true
      eval_only: true
      deterministic_eval: true
      resume_path: results/paper_eval/town05_main_10ms/ckpt_latest.pt
      
- name: fixed_cbf
  base_agent_config: simulation/leaderboard/team_code/agent_config/pnp_config_rl_cbf_2.yaml
  overrides:
    cbf:
      enabled: true
    rl:
      enabled: false
- name: pid_only
  base_agent_config: simulation/leaderboard/team_code/agent_config/pnp_config_rl_cbf_2.yaml
  overrides:
    cbf:
      enabled: false
    rl:
      enabled: false
- name: fixed_cbf_low_gamma
  base_agent_config: simulation/leaderboard/team_code/agent_config/pnp_config_rl_cbf_2.yaml
  overrides:
    rl:
      enabled: false
    cbf:
      enabled: true
      gamma_vehicle: 0.1
      gamma_ped: 0.1
      gamma_bike: 0.1
- name: fixed_cbf_high_gamma
  base_agent_config: simulation/leaderboard/team_code/agent_config/pnp_config_rl_cbf_2.yaml
  overrides:
    rl:
      enabled: false
    cbf:
      enabled: true
      gamma_vehicle: 0.8
      gamma_ped: 0.8
      gamma_bike: 0.8

# Remaining points of the fixed-CBF gamma sensitivity sweep (IROS review R1 / R8
# W3, Q1: "the fixed CBF baseline lacks a sensitivity sweep"). Together with
# fixed_cbf (0.5), fixed_cbf_low_gamma (0.1) and fixed_cbf_high_gamma (0.8) above,
# this gives 8 points across [0.1, 0.8] to build a collision-rate-vs-completion
# Pareto frontier and show where the adaptive policy sits relative to the best
# static gain.
- name: fixed_cbf_g02
  base_agent_config: simulation/leaderboard/team_code/agent_config/pnp_config_rl_cbf_2.yaml
  overrides:
    rl:
      enabled: false
    cbf:
      enabled: true
      gamma_vehicle: 0.2
      gamma_ped: 0.2
      gamma_bike: 0.2
- name: fixed_cbf_g03
  base_agent_config: simulation/leaderboard/team_code/agent_config/pnp_config_rl_cbf_2.yaml
  overrides:
    rl:
      enabled: false
    cbf:
      enabled: true
      gamma_vehicle: 0.3
      gamma_ped: 0.3
      gamma_bike: 0.3
- name: fixed_cbf_g04
  base_agent_config: simulation/leaderboard/team_code/agent_config/pnp_config_rl_cbf_2.yaml
  overrides:
    rl:
      enabled: false
    cbf:
      enabled: true
      gamma_vehicle: 0.4
      gamma_ped: 0.4
      gamma_bike: 0.4
- name: fixed_cbf_g06
  base_agent_config: simulation/leaderboard/team_code/agent_config/pnp_config_rl_cbf_2.yaml
  overrides:
    rl:
      enabled: false
    cbf:
      enabled: true
      gamma_vehicle: 0.6
      gamma_ped: 0.6
      gamma_bike: 0.6
- name: fixed_cbf_g07
  base_agent_config: simulation/leaderboard/team_code/agent_config/pnp_config_rl_cbf_2.yaml
  overrides:
    rl:
      enabled: false
    cbf:
      enabled: true
      gamma_vehicle: 0.7
      gamma_ped: 0.7
      gamma_bike: 0.7

# Single-agent / no-collaboration ablation (IROS review R1: "the collaborative
# aspect is not ablated"). Swaps the codriving perception+planner checkpoint for
# no_collaboration. IMPORTANT CAVEAT (found while wiring this up): the CBF filter
# and the RL policy's 11-dim observation are built from ground-truth CARLA actor
# state (world.get_actors()), not from the perception model's detections -- see
# pnp_infer_action_e2e.py line ~1225. So the safety *layer* itself is perception-
# agnostic by construction; this ablation instead tests whether the safety layer
# still helps when paired with a weaker, non-collaborative upstream *planner*
# (worse waypoints/desired speed), not whether the safety layer needs
# collaborative perception to function. Frame it accordingly in the writeup.
- name: rl_cbf_adaptive_no_collab
  base_agent_config: simulation/leaderboard/team_code/agent_config/pnp_config_rl_cbf_2.yaml
  overrides:
    cbf:
      enabled: true
    rl:
      enabled: true
      eval_only: true
      deterministic_eval: true
      resume_path: results/paper_eval/town05_main_10ms/ckpt_latest.pt
    perception:
      perception_model_dir: checkpoints/no_collaboration/perception
    planning:
      planner_model_checkpoint: checkpoints/no_collaboration/planner/no_collaboration_planner.ckpt

# Rule-based (non-learned) gamma scheduler baseline (IROS review R8 W4: "no
# comparison to ... a rule-based scheduler"). No checkpoint needed -- gammas come
# from a fixed per-class time-to-collision ramp instead of the trained policy.
- name: rule_based_cbf
  base_agent_config: simulation/leaderboard/team_code/agent_config/pnp_config_rl_cbf_2.yaml
  overrides:
    cbf:
      enabled: true
    rl:
      enabled: true
      policy_type: rule_based
      rule_based_ttc_min: 1.0
      rule_based_ttc_max: 4.0
